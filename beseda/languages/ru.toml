code = "ru"
stt = "gigaam"  # GigaAM v3: faster and more accurate than Whisper for Russian
wake_word = "вика"
# Endings the wake word may take, so "Вика", "Вику", "Вике", "Викой" all work.
wake_endings = ["", "а", "у", "е", "и", "ы", "о", "ой", "ою", "ей"]
style_prompt = "Здравствуйте, как ваши дела? Приятно познакомиться."
voice_prompt = """
Тебя зовут Вика, ты девушка: о себе говори в женском роде (сделала, нашла, поняла).
Ты голосовой ассистент: всё, что ты пишешь, озвучивается синтезатором речи.
Отвечай по-русски, кратко и разговорно, как в живой беседе.
Не используй markdown, списки, таблицы, эмодзи и блоки кода.
Числа, даты и единицы измерения пиши словами, латинские названия — русскими буквами, как они произносятся.
Если нужен код или длинный результат — запиши его в файл, а голосом скажи итог.
"""
stop_phrases = [
    "стоп", "хватит", "отбой", "отмена", "всё", "все", "пока", "до свидания",
    "спасибо", "спасибо всё", "всё спасибо", "спасибо все", "все спасибо", "стоп стоп",
]
# A phrase made only of triggers and fillers asks to wait; it needs at least one trigger.
hold_triggers = [
    "подожди", "подождите", "погоди", "погодите", "подумать", "подумаю", "секунду", "секундочку",
    "минуту", "минутку", "минуточку", "момент",
]
hold_fillers = ["дай", "дайте", "мне", "одну", "сейчас", "щас", "так", "ну", "ещё", "еще", "немного", "чуть", "я"]
greeting = "Привет."
sample_text = "Привет! Я посмотрел проект: в папке четыре файла, и все тесты проходят. Хочешь, расскажу подробнее, что именно я поменял и почему?"
silero_model = "https://models.silero.ai/models/tts/ru/v5_5_ru.pt"

[voices]
silero = ["xenia", "baya", "kseniya", "aidar", "eugene"]
edge = ["ru-RU-SvetlanaNeural", "ru-RU-DmitryNeural"]
say = ["Milena"]

[ui]
loading = "Загрузка…"
log = "Лог: {path}"
intro = "Скажите «{wake}, …». После ответа {follow_up} с можно продолжать без обращения, «стоп» завершает разговор."
hint = "Пробел — микрофон вкл/выкл · Esc — перебить · q — выход"
you = "Вы:"
assistant = "Ассистент:"
ignored = "· не мне: {text}"
error = "Ошибка: {error}"
error_see_log = "Ошибка: {error} (подробности в логе)"
interrupted = "(прервано)"
not_spoken = "Ответ не озвучен (подробности в логе)"
waiting = "(жду {duration})"
minutes = "{n:g} мин"
seconds = "{n:g} с"
remaining = "ещё {time}"
session_end = "— разговор завершён: {reason} —"
recording_saved = "Запись диалога: {path}"

[ui.status]
idle = "⏸  микрофон выключен — Пробел: включить"
standby = "💤  жду обращения"
listening = "🎙  слушаю…"
hearing = "🎙  слышу вас…"
transcribing = "✍️  распознаю…"
thinking = "💭  думаю…"
tool = "🔧  выполняю…"
speaking = "🔊  говорю…"

[ui.end_reason]
timeout = "тишина"
stop = "стоп"
pause = "микрофон выключен"
